<!DOCTYPE html>
  <html xmlns:th="http://www.thymeleaf.org">
     <head>
         <meta charset="UTF-8">
       <title>Registrar Vehículo</title>

         <style>
                body{
           font-family: Arial, sans-serif;
           background:#f4f6f9;
     }

          container{
          width:500px;
          margin:30px auto;
          background:white;
          padding:20px;
          border-radius:10px;
          box-shadow:0 0 10px rgba(0,0,0,0.2);
          }

              input{
            width:100%;
            padding:10px;
            margin-top:5px;
           margin-bottom:15px;
      }

button{
    background:#1e3a8a;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
       }
      </style>

        </head>
              <body>

                <div class="container">

                   <h2>Registrar Vehículo</h2>

                    <form th:action="@{/veiculos/save}" method="post">

                      <label>Marca</label>
                            <input type="text" name="marca">

                               <label>Modelo</label>
                                  <input type="text" name="modelo">

                                   <label>Precio</label>
                         <input type="number" step="0.01" name="precio">

                           <label>Descripción</label>
                           <input type="text" name="descripcion">

                     <label>Imagen</label>
                       <input type="text" name="imagen" placeholder="toyota.jpg">

                            <button type="submit">Guardar</button>

                                   </form>

                                      </div>

                                         </body>
                                               </html>
