<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>VeloxCar</title>
</head>
<body>

    <h1>Listado de Vehículos</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Precio</th>
                <th>Descripción</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="v : ${listadoVeiculos}">
                <td th:text="${v.id}"></td>
                <td th:text="${v.marca}"></td>
                <td th:text="${v.modelo}"></td>
                <td th:text="${v.precio}"></td>
                <td th:text="${v.descripcion}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
