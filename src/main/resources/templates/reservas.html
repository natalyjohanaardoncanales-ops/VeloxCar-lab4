<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Reservar Vehículo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#eef2f7; }
.card { max-width:700px; margin:50px auto; border:none; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.1); }
.card-header { background:#1e3a8a; color:white; padding:20px; }
.btn-reserva { background:#16a34a; color:white; border:none; }
.vehiculo-card { border:2px solid #ddd; border-radius:10px; transition:0.2s; }
.vehiculo-card:hover { border-color:#16a34a; }
.radio-vehiculo:checked + .vehiculo-card { border-color:#16a34a; background:#f0fdf4; }
</style>

</head>

<body>

<div class="card">

    <div class="card-header">
        <h2>Reserva de Vehículo</h2>
    </div>

    <div class="card-body">

        <form th:action="@{/reservas/save}"
              th:object="${reserva}"
              method="post">

            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" th:field="*{nombre}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" th:field="*{correo}" />
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de Reserva</label>
                <input type="date" class="form-control" th:field="*{fecha}" />
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Selecciona un Vehículo</label>
                <div class="row">
                    <div th:each="v : ${vehiculos}" class="col-6 mb-3">
                        <label style="cursor:pointer; width:100%;">
                            <input type="radio"
                                   name="vehiculo"
                                   th:value="${v.marca + ' ' + v.modelo}"
                                   style="display:none;"
                                   class="radio-vehiculo"/>
                            <div class="card text-center p-2 vehiculo-card">
                                <img th:src="@{/imagenes/{img}(img=${v.imagen})}"
                                     style="width:100%; height:80px; object-fit:cover; border-radius:8px;">
                                <small class="mt-1 fw-bold" th:text="${v.marca + ' ' + v.modelo}"></small>
                                <small class="text-success" th:text="${'$' + v.precio + '/día'}"></small>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <a href="/" class="btn btn-secondary w-100 mb-2">← Volver al inicio</a>

            <button type="submit" class="btn btn-reserva w-100">
                Confirmar Reserva
            </button>

        </form>

    </div>

</div>

</body>
</html>
